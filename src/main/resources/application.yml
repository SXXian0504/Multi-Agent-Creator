# 文章智能体配置
article:
  agent:
    orchestrator:
      # 是否启用多智能体编排模式（支持配图并行生成）
      # true: 使用 Spring AI Alibaba 多智能体编排
      # false: 使用原有的 ArticleAgentService
      enabled: true
    # Agent 最大迭代次数
    max-iterations: 10
  review:
    # 文本评审使用高阶文本模型，避免纯文本评审误走视觉模型触发图片 URL 校验
    text-model: qwen-max
    # 图片结果评审使用多模态模型
    image-model: qwen-vl-plus
    image-fallback-models: qwen3.5-plus,qwen3.5-omni-plus
    vision-endpoint: https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions

# RAG 知识库增强配置
rag:
  enabled: true
  top-k: 8
  context-max-chars: 4000
  local-storage-dir: data/rag
  datasource:
    url: jdbc:postgresql://localhost:5432/multi_agent_rag
    username: postgres
    password: postgres
  embedding:
    endpoint: https://dashscope.aliyuncs.com/compatible-mode/v1/embeddings
    model: text-embedding-v4
    dimension: 1536
    # true 仅用于本地开发无 API Key 时跑通索引链路；生产建议关闭。
    local-fallback-enabled: true
